:root{--bg:#09100D;--panel:#101A15;--line:#24362D;--text:#F1F7F3;--muted:#8FA89D;--green:#0AC229;
 --head:Akrobat,Oswald,"Arial Narrow",sans-serif;
 --body:"Vela Sans",Inter,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);overflow:hidden;overscroll-behavior:none}
.caps{font-family:var(--head);text-transform:uppercase;font-weight:800;letter-spacing:.01em}
#stage{position:fixed;inset:0;touch-action:none;cursor:grab}
#stage.drag{cursor:grabbing}
#board{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.rail{fill:none;stroke:#4D6E5F;stroke-width:2.5}
.sq{fill:#09100D;stroke-width:2.5}
.node{cursor:pointer}
.node .fr{transition:fill .2s}
.node:active .fr{fill:#fff}
.nl{font-family:var(--head);font-weight:800;fill:#0E1511;text-transform:uppercase;pointer-events:none}
.hd{fill:#09100D;stroke-width:2.2}
.bn{font-family:var(--head);font-weight:800;fill:#F1F7F3;text-transform:uppercase;pointer-events:none}
#tag{max-width:calc(100vw - 80px);position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:5;border:2px solid var(--green);padding:7px 10px 5px;font-size:16px;line-height:1.05;background:rgba(9,16,13,.78);pointer-events:none}
#tag small{display:block;font-family:var(--body);font-weight:500;text-transform:uppercase;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.04em}
#zoom{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:5;display:flex;flex-direction:column;gap:6px}
#zoom button{width:40px;height:40px;border:2px solid var(--line);background:rgba(16,26,21,.9);color:var(--text);font:600 20px Inter;border-radius:0;display:grid;place-items:center;padding:0}
#zoom button:active{border-color:var(--green)}
#intro{position:fixed;inset:0;z-index:20;background:rgba(9,16,13,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px;transition:opacity .3s}
#intro.off{opacity:0;pointer-events:none}
#intro .ib2{max-width:420px;border:2px solid var(--green);padding:22px 20px;background:rgba(16,26,21,.9)}
#intro h2{margin:0 0 12px;font-size:34px;line-height:1}
#intro p{margin:0 0 12px;font-size:15px;line-height:1.5}
#intro b{color:var(--green);font-weight:600}
#intro button{margin-top:6px;width:100%;border:2px solid var(--green);background:var(--green);color:#09100D;font-size:20px;padding:12px 10px 9px;cursor:pointer}
#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;border:2px solid var(--line);background:rgba(16,26,21,.92);padding:10px 14px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;width:max-content;max-width:calc(100vw - 32px);transition:opacity .4s;pointer-events:none}
#hint b{color:var(--text);font-weight:600}
#hint.off{opacity:0}
#sheet{position:fixed;left:0;right:0;bottom:0;height:56dvh;z-index:10;background:var(--panel);border-top:3px solid var(--c,var(--green));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1),height .3s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.open{transform:none}
#sheet.tall{height:90dvh}
@media(min-width:820px){#sheet{left:auto;width:440px;height:calc(100dvh - 24px);top:12px;bottom:12px;border:3px solid var(--c,var(--green));transform:translateX(110%)}#sheet.open{transform:none}#sheet.tall{height:calc(100dvh - 24px)}#grab{display:none}}
#grab{height:22px;flex:none;display:grid;place-items:center;cursor:pointer}
#grab i{width:44px;height:4px;background:var(--line);display:block}
#sh-head{flex:none;padding:0 16px 10px;display:flex;gap:12px;align-items:flex-start}
#sh-lg{flex:none;width:56px;height:56px;background:#E9F0EB;display:grid;place-items:center;padding:5px}
#sh-lg img{max-width:100%;max-height:100%;display:block}
#sh-head .t{flex:1;min-width:0}
#sh-name{font-size:32px;line-height:.98;margin:0;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
#sh-sub{color:var(--muted);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.03em;line-height:1.35}
#sh-x{flex:none;width:40px;height:40px;border:2px solid var(--line);background:none;color:var(--text);font:500 20px Inter;padding:0}
#sh-body{flex:1;overflow-y:auto;padding:4px 16px 28px;-webkit-overflow-scrolling:touch}
.sec{margin-top:20px}
.sec>h3{margin:0 0 10px;font-size:15px;color:var(--c);display:inline-block;border:2px solid var(--c);padding:5px 8px 3px;line-height:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.st{border:2px solid var(--c);padding:10px 10px 8px}
.st b{display:block;font:700 32px/1 var(--head);letter-spacing:.01em}
.st span{font-size:12px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
ul.f{list-style:none;margin:0;padding:0;display:grid;gap:8px}
ul.f li{position:relative;padding:9px 10px 9px 28px;border:1px solid var(--line);font-size:14px;line-height:1.4}
ul.f li:before{content:"";position:absolute;left:10px;top:15px;width:8px;height:8px;background:var(--c)}
p.t{margin:0 0 10px;font-size:14px;line-height:1.45}
.bar{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.bar b{font:700 24px var(--head)}
.bar .tr{position:relative;min-height:36px;border:1px solid var(--line);display:flex;align-items:center;padding:4px 8px;font-size:12px;line-height:1.25;overflow:hidden}
.bar .tr:before{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--bc);opacity:.4}
.bar .tr span{position:relative}
.bar .tr em{font-style:normal;color:var(--muted);margin-left:6px;position:relative;white-space:nowrap}
.steps{display:grid;gap:8px}
.steps div{border:2px solid var(--c);padding:10px;min-height:56px;display:flex;align-items:center;gap:12px;font:800 17px/1.1 var(--head);text-transform:uppercase}
.steps div i{flex:none;width:36px;height:36px;display:grid;place-items:center;background:var(--c);color:#09100D;font:800 16px/1 var(--head);font-style:normal}
.dates{display:grid;gap:6px}
.dates div{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:13.5px;border-bottom:1px solid var(--line);padding-bottom:6px}
.dates b{font:700 17px var(--head);color:var(--c);text-transform:uppercase}
.go{display:flex;flex-wrap:wrap;gap:8px}
.go button{border:2px solid var(--line);background:none;color:var(--text);font:700 14px var(--head);text-transform:uppercase;padding:8px 10px 6px;cursor:pointer}
.people{display:grid;gap:8px}
.people div{border:1px solid var(--line);padding:9px 10px;font-size:13px;color:var(--muted);line-height:1.4}
.people b{display:block;color:var(--text);font:700 17px var(--head);text-transform:uppercase}
.tl{border-left:2px solid var(--c);margin-left:5px;padding-left:16px}
.tl .it{position:relative;padding-bottom:16px}
.tl .it:before{content:"";position:absolute;left:-23px;top:3px;width:10px;height:10px;background:var(--bg);border:2px solid var(--c)}
.tl .it.hi:before{background:var(--c)}
.tl .d{font:700 15px var(--head);text-transform:uppercase;color:var(--c)}
.tl .n{font-size:14px;line-height:1.35;margin-top:2px}
.tl .r{font:700 14px var(--head);text-transform:uppercase;margin-top:3px}
.tl .p{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{border:1px solid var(--line);padding:5px 8px;font-size:12px;line-height:1.3}
.chips b{color:var(--c);font-weight:600}
/* строка: текст в квадратной рамке + квадратная кнопка со ссылкой */
.row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px;min-height:56px}
.row .bx{flex:1;min-width:0;border:2px solid var(--c);padding:10px 12px;display:flex;flex-direction:column;justify-content:center}
.row .bx b{display:block;font:800 17px/1.1 var(--head);text-transform:uppercase}
.row .bx p{margin:6px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.row .bx small{display:block;margin-top:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.row .bx .r{font:800 15px var(--head);text-transform:uppercase;margin-top:4px;color:var(--text)}
.row .ib{flex:none;width:56px;border:2px solid var(--c);color:var(--c);display:grid;place-items:center;text-decoration:none}
.row .ib:active{background:var(--c);color:#09100D}
.row .ib svg{width:20px;height:20px}
.sub{margin:16px 0 8px;font:800 14px var(--head);text-transform:uppercase;color:var(--muted);letter-spacing:.04em}
details.doc{border:2px solid var(--c);margin-bottom:8px}
details.doc summary{list-style:none;cursor:pointer;padding:12px;font:800 17px/1.1 var(--head);text-transform:uppercase;display:flex;justify-content:space-between;gap:10px}
details.doc summary::-webkit-details-marker{display:none}
details.doc summary:after{content:"+";color:var(--c)}
details.doc[open] summary:after{content:"−"}
details.doc .dc{padding:0 12px 14px;border-top:1px solid var(--line)}
details.doc h4{margin:16px 0 6px;font:800 16px var(--head);text-transform:uppercase;color:var(--c)}
details.doc p{margin:0 0 7px;font-size:13px;line-height:1.5}
details.doc p b{color:var(--c);font-weight:600;margin-right:6px}
details.doc p.li{padding-left:14px;position:relative}
details.doc p.li:before{content:"";position:absolute;left:0;top:7px;width:6px;height:6px;background:var(--c)}
.rules{display:block;width:100%;border:2px solid var(--c);margin:8px 0}
svg.lc text{font-family:var(--head);font-weight:700;fill:var(--text)}
</style>
</head>

var DOCS=[{"name": "Положение о корпоративной культуре", "items": [["h", "", "1.       Общие положения"], ["p", "1.1.", "Корпоративная культура профбюро Высшей ИТ школы ППОС ТГУ (далее — Профбюро) — это внутриорганизационные цели, ценности, нормы и установки, которыми должны руководствоваться члены Профбюро в своей работе."], ["p", "1.2.", "Положение о корпоративной культуре Профбюро (далее — Положение) закрепляет корпоративные ценности Профбюро, определяет этические принципы и правила делового поведения, обязательные для исполнения членами Профбюро."], ["p", "1.3.", "Основные функции корпоративной культуры:"], ["li", "", "формирование имиджа Профбюро;"], ["li", "", "определение принципов взаимоотношений между членами Профбюро;"], ["li", "", "укрепление командного духа Профбюро;"], ["li", "", "укрепление чувства причастности Профбюро к деятельности ППОС ТГУ и Профессионального союза работников народного образования и науки Российской Федерации (далее — Профсоюза)."], ["p", "1.4.", "Настоящее Положение разработано на основе Положения о корпоративной культуре ППОС ТГУ, Положения о профсоюзных бюро ППОС ТГУ и иных локальных актах ППОС ТГУ."], ["h", "", "2.     Ключевые элементы Корпоративной культуры"], ["p", "2.1.", "Миссия   Профбюро    заключается   в   формировании    положительного      образа Профсоюза и профсоюзной деятельности для студентов Высшей ИТ школы ТГУ (далее — Школы) при помощи современных технологий."], ["p", "2.2.", "Целью Профбюро является обеспечение и защита интересов студентов Школы — членов Профсоюза."], ["p", "2.3.", "Члены Профбюро принимают и разделяют принципы Профбюро:"], ["li", "", "уважение к личности студентов Школы — членов Профсоюза, их достоинству и правам;"], ["li", "", "приоритет интересов студентов Школы — членов Профсоюза;"], ["li", "", "солидарность и взаимопомощь, поддержка друг друга на профсоюзных конкурсах и других важных событиях в рамках обучения в университете;"], ["li", "", "профессионализм,    предполагающий      высокий     уровень       компетентности, ответственности и качества реализуемых инициатив;"], ["li", "", "преемственность, обеспечивающая сохранение опыта, традиций и эффективных практик предыдущих поколений профсоюзного актива;"], ["li", "", "открытость и подотчётность — обеспечение прозрачности деятельности Профбюро, его структурных органов и их ответственности перед членами Профсоюза;"], ["li", "", "законность — строгое соблюдение законодательства Российской Федерации, Устава Профсоюза и локальных актов ППОС ТГУ;"], ["li", "", "демократичность — обеспечение участия членов Профсоюза в формировании позиций и принятии решений по ключевым вопросам деятельности;"], ["li", "", "коллегиальность — принятие решений на основе коллегиального обсуждения и согласования в рамках деятельности Профбюро;"], ["li", "", "этичность взаимодействия — соблюдение норм профессиональной, деловой и корпоративной этики во всех формах коммуникации;"], ["li", "", "открытость к честной и конструктивной обратной связи и критике;"], ["li", "", "любовь к своей деятельности, выражающаяся в заинтересованности, вовлечённости и стремлении к качественному выполнению деятельности."], ["h", "", "3.     Организация работы Профбюро"], ["p", "3.1.", "Профбюро      имеет   структуру,   утверждаемую   заседаниями   Профбюро     и соответствующую Положению о профсоюзных бюро ППОС ТГУ."], ["p", "3.1.1.", "В Профбюро создаются офисы — структурные органы Профбюро с положениями, регламентирующим их деятельность. Внутри офисов могут создаваться отделы."], ["p", "3.1.2.", "Офисы Профбюро могут иметь дополнительные названия, использующиеся для внешнего позиционирования."], ["p", "3.2.", "Работа Профбюро организовывается через очные встречи и коммуникацию в чатах Профбюро в мессенджерах."], ["p", "3.2.1.", "Все члены Профбюро должны посещать заседания Профбюро, проводящиеся очно и онлайн."], ["p", "3.3.", "Организация    мероприятий   (проектов)   Профбюро   основывается   на   основе регламентов для соответствующих типов мероприятий (проектов), состоящих из минимального набора зон ответственности и шагов реализации с примерными дедлайнами."], ["p", "3.4.", "Все материалы, касающиеся работы Профбюро, размещаются в общих источниках: облачные ресурсы Профбюро, команды Профбюро в Figma и иных."], ["p", "3.4.1.", "Права доступа к материалам раздаются председателем Профбюро в соответствии с целесообразностью, но с соблюдением принципов максимальной открытости."], ["p", "3.4.2.", "При выходе из состава Профбюро и/или смене должности члены Профбюро передают права владения материалами на облачных ресурсах Профбюро аккаунту Профбюро."], ["p", "3.5.", "За активную деятельность в рамках Профбюро члены Профбюро могут получать материальные и нематериальные поощрения."], ["p", "3.5.1.", "За успешную организацию мероприятия (проекта) каждый организатор и волонтёр получает справку от ППОС ТГУ. Если мероприятие (проект) является имиджевым, то организаторы и волонтёры получают грамоты и благодарственные письма."], ["p", "3.5.2.", "За особые заслуги в деятельности Профбюро члены Профбюро могут получать корпоративную сувенирную продукцию (далее — мерч)."], ["p", "3.5.3.", "Порядок и условия получения вознаграждений определяются председателем Профбюро."], ["p", "3.5.4.", "Покупка мерча и иных материальных вознаграждений осуществляется за счёт средств, заложенных в финансовом плане Профбюро, и иных источников финансирования."], ["p", "3.6.", "За невыполнение взятых на себя обязательств, а также нарушение данного Положения на члена Профбюро может быть наложено взыскание в виде выговора, снятия с должности или исключения из состава Профбюро."], ["p", "3.6.1.", "Член Профбюро может быть исключён из состава Профбюро за неактивность в течение трёх месяцев."], ["p", "3.6.2.", "Факт     неактивности   определяется       руководителем   соответствующего   офиса Профбюро или председателем Профбюро."], ["p", "3.6.3.", "Пропуск заседания Профбюро без уважительной причины приравнивается к неактивности."], ["p", "3.6.4.", "При применении дисциплинарного взыскания в виде исключении из состава Профбюро член Профбюро обязан вернуть мерч, полученный от Профбюро."], ["h", "", "4.     Взаимодействие между членами Профбюро"], ["p", "4.1.", "Взаимодействие между членами Профбюро строится на принципах Профбюро."], ["p", "4.2.", "Члены Профбюро должны следовать принятым правилам коммуникации."], ["p", "4.2.1.", "В Профбюро принято обращение друг к другу на «ты»."], ["p", "4.2.2.", "В ночное время нежелательны отметки членов Профбюро («пинги»)."], ["p", "4.2.3.", "Вся коммуникация, касающаяся работы Профбюро, должна вестись в чатах Профбюро в соответствующих темах. Коммуникация в личных сообщениях по рабочим вопросам нежелательна."], ["p", "4.2.4.", "Коммуникация между членами Профбюро строится на принципах взаимного уважения. Категорически запрещены травля, оскорбление членов Профбюро и поведение, приносящее дискомфорт членам Профбюро."], ["p", "4.3.", "Профбюро поддерживает существующие и создаёт новые традиции, направленные на поддержание командного духа."], ["p", "4.3.1.", "В конце полугодий проводятся неформальные встречи для членов Профбюро. На встречах могут проводиться награждения членов Профбюро и подведение итогов деятельности за полугодие."], ["p", "4.3.2.", "Председатель Профбюро ведёт Книгу Профбюро, которая передаётся ему на Отчётно-выборной конференции уходящим с должности председателем Профбюро."], ["h", "", "5.     Внешнее позиционирование Профбюро"], ["p", "5.1.", "Элементы внешнего позиционирования создают бренд Профбюро и способствуют созданию позитивного имиджа Профбюро."], ["p", "5.2.", "К элементам внешнего позиционирования Профбюро относятся: логотип, девиз и слоганы, фирменный стиль, мерч, публикации в социальных сетях Профбюро, печатная продукция."], ["p", "5.3.", "Логотип Профбюро отражает принадлежность Профбюро к Профсоюзу и используется во всех элементах внешнего позиционирования Профбюро."], ["p", "5.3.1.", "Логотип Профбюро утверждается и принимается заседанием Профбюро."], ["p", "5.3.2.", "Офисы Профбюро могут иметь собственные логотипы на основе логотипа Профбюро."], ["p", "5.4.", "Девиз Профбюро — «Создаём код студенчества». Девиз отражает единство и синергию общественной и профсоюзной деятельности Профбюро и профессиональной направленности Школы."], ["p", "5.5.", "Фирменный стиль Профбюро определяет принципы оформления элементов внешнего позиционирования Профбюро."], ["p", "5.5.1.", "Фирменный стиль Профбюро может состоять из брендбука, гайдбука, а также иных материалов, утверждённых заседанием Профбюро."], ["p", "5.5.2.", "Фирменный стиль Профбюро разрабатывается и актуализируется Медиа-офисом Профбюро."], ["p", "5.5.3.", "Фирменный стиль Профбюро включает в себя элементы официального брендбука ППОС ТГУ, приведённого в Приложении №1 к Положению о корпоративной культуре ППОС ТГУ."], ["p", "5.6.", "Корпоративный цвет Профбюро — зелёный."], ["p", "5.7.", "Мерч, публикации в социальных сетях Профбюро и печатная продукция должны соответствовать фирменному стилю Профбюро и брендбуку ППОС ТГУ."], ["p", "5.7.1.", "Члены Профбюро надевают мерч Профбюро на корпоративных мероприятиях (проектах), организуемых Профбюро и ППОС ТГУ."], ["p", "5.7.2.", "Если члены Профбюро участвуют в мероприятиях (проектах), где представляют ППОС ТГУ, используется мерч и символика ППОС ТГУ."], ["p", "5.8.", "К внешнему позиционированию также относятся кричалки, плакаты, иные материальные и нематериальные вещи, использующую элементы фирменного стиля Профбюро и (или) использующиеся для создания положительного имиджа Профбюро, ППОС ТГУ и Профсоюза."], ["h", "", "6.     Заключительные положения"], ["p", "6.1.", "Настоящее Положение вступает в силу со дня утверждения заседанием Профбюро и согласования в соответствии с Положением о профсоюзных бюро ППОС ТГУ."], ["p", "6.2.", "В настоящее Положение могут вноситься изменения и дополнения по инициативе любого члена Профбюро."], ["p", "6.3.", "Изменения и дополнения в настоящее Положение рассматриваются и утверждаются заседанием Профбюро."], ["p", "6.3.1.", "При изменении Положения о корпоративной культуре ППОС ТГУ для устранения возникших противоречий принимаются изменения и дополнения в настоящее Положение."], ["p", "6.4.", "Настоящее Положение доводится до всех членов Профбюро при принятии в состав Профбюро."]]}, {"name": "Положение Штаба профбюро", "items": [["h", "", "1.       Общие положения"], ["p", "1.1.", "Штаб профбюро Высшей ИТ школы ППОС ТГУ (далее — Профбюро) — структурный орган Профбюро, создаваемый в целях координации деятельности остальных структурных органов Профбюро (далее — офисов)."], ["p", "1.2.", "Настоящее Положение разработано в соответствии с Уставом Профессионального союза работников народного образования и науки Российской Федерации (далее — Профсоюз), Положением о профсоюзных бюро ППОС ТГУ и иными локальными атаками ППОС ТГУ."], ["p", "1.3.", "Настоящее Положение определяет содержание и порядок работы Штаба и его членов."], ["p", "1.4.", "Штаб в своей деятельности подотчётен председателю Профбюро."], ["p", "1.5.", "Решения Штаба обязательны для исполнения членами Профбюро."], ["h", "", "2.     Цель и основные направления деятельности Штаба"], ["p", "2.1.", "Целью Штаба является координация деятельности офисов Профбюро для эффективной и своевременной реализации уставных задач Профбюро."], ["p", "2.2.", "Для решения задач Штаб:"], ["li", "", "разрабатывает и реализует меры по выполнению решений выборных органов ППОС ТГУ;"], ["li", "", "разрабатывает и реализует меры по повышению мотивации членства в Профсоюзе и продления профсоюзных билетов;"], ["li", "", "определяет приоритетные направления деятельности и проекты Профбюро;"], ["li", "", "изучает, анализирует, обобщает и распространяет положительный опыт работы офисов Профбюро, других профбюро и структурных подразделений ППОС ТГУ;"], ["li", "", "принимает решения об изменении структуры Профбюро, создании, реорганизации или ликвидации офисов Профбюро;"], ["li", "", "рекомендует членам Профбюро кандидатуры для включения новых членов Профбюро, кандидатуры на руководящие должности Профбюро;"], ["li", "", "определяет формат и содержание образовательных продуктов Профбюро для согласования с Департаментом корпоративно-организационного развития ППОС ТГУ;"], ["li", "", "принимает решения о награждении и взыскании членов Профбюро, исключении из состава Профбюро за неактивность;"], ["li", "", "выполняет иные полномочия по поручению председателя Профбюро."], ["h", "", "3.     Порядок формирования и деятельности Штаба"], ["p", "3.1.", "Решение о формировании и роспуске Штаба принимается председателем Профбюро."], ["p", "3.2.", "В состав Штаба входят, как правило, обязательные должности и руководители офисов Профбюро. По решению Штаба могут в состав могут включаться иные члены Профбюро в зависимости от занимаемой должности и (или) стажа нахождения в Профбюро."], ["p", "3.2.1.", "В рамках Штаба могут создаваться рабочие группы по направлениям деятельности Штаба, в которые могут приглашаться члены Профбюро, не входящие в состав Штаба."], ["p", "3.3.", "Руководит деятельностью Штаба председатель Профбюро, в его отсутствие — заместитель председателя Профбюро."], ["p", "3.4.", "Собрания Штаба проводятся по мере необходимости, но не реже одного раза в две недели."], ["p", "3.5.", "Решения Штаба принимаются простым большинством присутствующих на собрании."], ["p", "3.5.1.", "Если решение, принятое на собрании Штаба, относится к деятельности иных членов Профбюро, информация о принятом решении доносится до членов Профбюро в течение одного календарного дня председателем Профбюро."], ["h", "", "4.     Заключительные положения"], ["p", "4.1.", "Настоящее Положение вступает в силу со дня утверждения заседанием Профбюро и согласования в соответствии с Положением о профсоюзных бюро ППОС ТГУ."], ["p", "4.2.", "Инициатива внесения изменений и дополнений в настоящее Положение принадлежит членам Штаба."], ["p", "4.3.", "Изменения и дополнения в настоящее Положение рассматриваются и утверждаются заседанием Профбюро."]]}];

/* ---------- карточка ---------- */
var sheet=$('#sheet'),cur=null;
function openOffice(k,fromHash){
  var d=D[k];if(!d)return;cur=k;var c=ACC[k];
  sheet.style.setProperty('--c',c);sheet.classList.remove('tall');
  $('#sh-lg img').src=LOGO[k];
  $('#sh-name').textContent=d.name;$('#sh-sub').textContent=d.sub;
  var b=$('#sh-body');b.style.setProperty('--c',c);b.innerHTML=d.html();b.scrollTop=0;
  sheet.classList.add('open');if((k==='staff'||k==='bureau')&&sz().W<820)sheet.classList.add('tall');
  if(!fromHash){try{history.replaceState(null,'','#'+k)}catch(e){location.hash=k}}
  focusNode(k);
}
function rectOf(k){
  if(k==='bureau'){var f=L.frame;return [f[0],f[1],f[2],f[3]]}
  return L.g[k];
}
function focusNode(k){
  var r=rectOf(k),s=sz(),wide=s.W>=820;
  var sheetPx=wide?440:s.H*0.56;
  var visW=wide?s.W-sheetPx:s.W,visH=wide?s.H:s.H-sheetPx;
  var sc;
  if(k==='bureau'){sc=Math.min(visW*0.94/r[2],visH*0.94/r[3])}
  else{sc=Math.min(visW*0.62/r[2],visH*0.62/r[3]);sc=Math.min(sc,s.W/110)}
  var vw=s.W/sc,vh=s.H/sc,cx=r[0]+r[2]/2,cy=r[1]+r[3]/2;
  tween({x:cx-(visW/2)/sc,y:cy-(visH/2)/sc,w:vw,h:vh},650);
}
function closeOffice(){
  cur=null;sheet.classList.remove('open','tall');
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
  tween(fullV,600);
}
$('#sh-x').onclick=closeOffice;
$('#grab').onclick=function(){sheet.classList.toggle('tall')};
$('#sh-body').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(b)openOffice(b.getAttribute('data-go'))});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&cur)closeOffice()});

/* ---------- жесты ---------- */
var P={},drag=null,pinch=null,moved=0;
function pdist(){var a=Object.keys(P).map(function(i){return P[i]});return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function pmid(){var a=Object.keys(P).map(function(i){return P[i]});return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2}}
stage.addEventListener('pointerdown',function(e){
  stage.setPointerCapture(e.pointerId);P[e.pointerId]={x:e.clientX,y:e.clientY};cancelAnimationFrame(tw);
  var n=Object.keys(P).length;
  if(n===1){drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=0;drag.t=e.target.closest&&e.target.closest('.node')}
  if(n===2){pinch={d:pdist(),w:view.w};drag=null;moved=99}
});
stage.addEventListener('pointermove',function(e){
  if(!P[e.pointerId])return;P[e.pointerId]={x:e.clientX,y:e.clientY};
  var s=sz();
  if(pinch&&Object.keys(P).length>=2){
    var f=pdist()/pinch.d,m=pmid();var nw=Math.max(60,Math.min(fullV.w*1.6,pinch.w/f));
    zoomAt(view.w/nw,m.x,m.y);return;
  }
  if(drag){
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;moved=Math.max(moved,Math.hypot(dx,dy));
    if(moved>6){stage.classList.add('drag');
      setV(clampV({x:drag.vx-dx/s.W*view.w,y:drag.vy-dy/s.H*view.h,w:view.w,h:view.h}))}
  }
});
function up(e){
  var wasTap=drag&&moved<=6&&Object.keys(P).length===1;
  delete P[e.pointerId];if(Object.keys(P).length<2)pinch=null;
  stage.classList.remove('drag');
  if(wasTap&&drag.t){openOffice(drag.t.getAttribute('data-id'))}
  if(!Object.keys(P).length)drag=null;
}
stage.addEventListener('pointerup',up);
stage.addEventListener('pointercancel',function(e){delete P[e.pointerId];pinch=null;drag=null;stage.classList.remove('drag')});
stage.addEventListener('wheel',function(e){e.preventDefault();zoomAt(Math.exp(-e.deltaY*0.0015),e.clientX,e.clientY)},{passive:false});
function zb(f){var s=sz();zoomAt(f,s.W/2,s.H/2)}
$('#zi').onclick=function(){zb(1.5)};$('#zo').onclick=function(){zb(1/1.5)};
$('#zr').onclick=function(){if(cur)closeOffice();else tween(fullV,500)};

document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('a[href]');if(a){a.target='_blank';a.rel='noopener'}},true);
$('#intro').addEventListener('click',function(e){$('#intro').classList.add('off')});
/* ---------- старт ---------- */
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(svg.firstChild)relabel()});
function start(){build();var h=(location.hash||'').slice(1);if(h&&D[h])openOffice(h,true)}
var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){var k=cur;mode=null;build();if(k)openOffice(k,true)},150)});
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1);if(h&&D[h]&&h!==cur)openOffice(h,true);else if(!h&&cur)closeOffice()});
start();
})();
</script>
